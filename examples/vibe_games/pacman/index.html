<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cortical Arcade — Pac-Man</title>
  <style>
    :root {
      --bg: #050814;
      --panel: #0f172a;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --gold: #facc15;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #111c3a 0%, var(--bg) 70%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      width: 100%;
      max-width: 540px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    h1 { margin: 0 0 4px; font-size: 1.4rem; color: var(--gold); }
    .subtitle { font-size: 0.78rem; color: var(--muted); margin-bottom: 12px; }
    .hud {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .hud-box {
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 8px;
    }
    .hud-label { font-size: 0.66rem; color: var(--muted); text-transform: uppercase; }
    .hud-val { font-size: 1.05rem; font-weight: 800; color: #38bdf8; }
    .canvas-wrap {
      position: relative;
      display: inline-block;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #2563eb;
      background: #02040a;
    }
    canvas { display: block; max-width: 100%; height: auto; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(5, 8, 20, 0.8);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
    }
    .overlay.hidden { display: none; }
    .controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      gap: 6px;
      justify-content: center;
      margin-top: 10px;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text);
      padding: 8px 14px;
      font-size: 0.82rem;
      font-weight: 700;
    }
    button:hover { background: #273549; }
    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #0284c7);
      border-color: #38bdf8;
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🟡 Arcade Pac-Man</h1>
    <div class="subtitle">Frecce o WASD · Power Pellet per rendere i fantasmi blu (+200) · P / Spazio Pausa</div>

    <div class="hud">
      <div class="hud-box"><div class="hud-label">Punti</div><div class="hud-val" id="score">0</div></div>
      <div class="hud-box"><div class="hud-label">Record</div><div class="hud-val" id="high-score">0</div></div>
      <div class="hud-box"><div class="hud-label">Vite</div><div class="hud-val" id="lives">❤️❤️❤️</div></div>
      <div class="hud-box"><div class="hud-label">Pallini</div><div class="hud-val" id="pellets">0</div></div>
    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="462" height="462"></canvas>
      <div class="overlay hidden" id="overlay">
        <div id="overlay-title" style="font-size:1.35rem; font-weight:800;"></div>
        <div id="overlay-sub" style="font-size:0.86rem; color:var(--muted);"></div>
        <button type="button" class="btn-primary" id="btn-overlay-action">▶ Rigioca</button>
      </div>
    </div>

    <div class="controls">
      <button type="button" id="btn-pause">⏸️ Pausa</button>
      <button type="button" class="btn-primary" id="btn-restart">🔄 Nuova Partita</button>
    </div>

    <div class="dpad" aria-label="Controlli touch">
      <div></div>
      <button type="button" data-dir="up">⬆️</button>
      <div></div>
      <button type="button" data-dir="left">⬅️</button>
      <button type="button" data-dir="down">⬇️</button>
      <button type="button" data-dir="right">➡️</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highEl = document.getElementById('high-score');
    const livesEl = document.getElementById('lives');
    const pelletsEl = document.getElementById('pellets');
    const overlayEl = document.getElementById('overlay');
    const overlayTitleEl = document.getElementById('overlay-title');
    const overlaySubEl = document.getElementById('overlay-sub');
    const overlayBtnEl = document.getElementById('btn-overlay-action');
    const pauseBtnEl = document.getElementById('btn-pause');

    const ROWS = 21;
    const COLS = 21;
    const TILE = canvas.width / COLS;
    const BEST_KEY = 'cortical_pacman_best';

    // 1=wall, 2=pellet, 3=power pellet, 4=ghost gate, 0=empty
    const BASE_MAP = [
      '111111111111111111111',
      '122222222212222222221',
      '131121112212211121131',
      '122222222222222222221',
      '121121211111112121121',
      '122221222212222122221',
      '111121112010211121111',
      '100021000000000120001',
      '111121011141110121111',
      '000020010000010020000',
      '111121011111110121111',
      '100021000000000120001',
      '111121011111110121111',
      '122222222212222222221',
      '121121112212211121121',
      '132122222000222221231',
      '112121211111112121211',
      '122221222212222122221',
      '121111112212211111121',
      '122222222222222222221',
      '111111111111111111111',
    ];

    const DIRS = {
      up: { x: 0, y: -1 },
      down: { x: 0, y: 1 },
      left: { x: -1, y: 0 },
      right: { x: 1, y: 0 },
    };

    let map = [];
    let remainingPellets = 0;
    let score = 0;
    let highScore = Number(localStorage.getItem(BEST_KEY) || 0) || 0;
    let lives = 3;
    let frightenedTicks = 0;
    let paused = false;
    let ended = false;
    let mouthPhase = 0;
    let tickCount = 0;
    let pac = null;
    let ghosts = [];
    let lastTime = 0;

    highEl.textContent = String(highScore);

    function cloneMap() {
      remainingPellets = 0;
      map = BASE_MAP.map((row) =>
        row.split('').map((ch) => {
          const val = Number(ch);
          if (val === 2 || val === 3) remainingPellets += 1;
          return val;
        })
      );
      pelletsEl.textContent = String(remainingPellets);
    }

    function resetPositions() {
      pac = { x: 10, y: 15, dir: { ...DIRS.left }, nextDir: { ...DIRS.left } };
      ghosts = [
        { name: 'Blinky', color: '#ef4444', scatter: { x: 19, y: 1 }, x: 10, y: 7, dir: { ...DIRS.left }, home: { x: 10, y: 9 }, releaseDelay: 0 },
        { name: 'Pinky', color: '#f472b6', scatter: { x: 1, y: 1 }, x: 9, y: 9, dir: { ...DIRS.up }, home: { x: 9, y: 9 }, releaseDelay: 6 },
        { name: 'Inky', color: '#22d3ee', scatter: { x: 19, y: 19 }, x: 10, y: 9, dir: { ...DIRS.up }, home: { x: 10, y: 9 }, releaseDelay: 14 },
        { name: 'Clyde', color: '#fb923c', scatter: { x: 1, y: 19 }, x: 11, y: 9, dir: { ...DIRS.up }, home: { x: 11, y: 9 }, releaseDelay: 22 },
      ];
    }

    function updateHud() {
      scoreEl.textContent = String(score);
      pelletsEl.textContent = String(remainingPellets);
      livesEl.textContent = lives > 0 ? '❤️'.repeat(lives) : '💀';
      if (score > highScore) {
        highScore = score;
        highEl.textContent = String(highScore);
        try { localStorage.setItem(BEST_KEY, String(highScore)); } catch {}
      }
    }

    function resetGame() {
      cloneMap();
      score = 0;
      lives = 3;
      frightenedTicks = 0;
      paused = false;
      ended = false;
      tickCount = 0;
      pauseBtnEl.textContent = '⏸️ Pausa';
      overlayEl.classList.add('hidden');
      resetPositions();
      updateHud();
      lastTime = performance.now();
    }

    function wrapX(x) {
      if (x < 0) return COLS - 1;
      if (x >= COLS) return 0;
      return x;
    }

    function canEnter(x, y, isGhost = false) {
      const wx = wrapX(x);
      if (y < 0 || y >= ROWS) return false;
      const cell = map[y][wx];
      if (cell === 1) return false;
      if (cell === 4 && !isGhost) return false;
      return true;
    }

    function addScore(pts) {
      score += pts;
      updateHud();
    }

    function stepPac() {
      const tryNextX = wrapX(pac.x + pac.nextDir.x);
      const tryNextY = pac.y + pac.nextDir.y;
      if (canEnter(tryNextX, tryNextY, false)) {
        pac.dir = { ...pac.nextDir };
      }
      const nx = wrapX(pac.x + pac.dir.x);
      const ny = pac.y + pac.dir.y;
      if (canEnter(nx, ny, false)) {
        pac.x = nx;
        pac.y = ny;
      }

      const cell = map[pac.y][pac.x];
      if (cell === 2) {
        map[pac.y][pac.x] = 0;
        remainingPellets -= 1;
        addScore(10);
      } else if (cell === 3) {
        map[pac.y][pac.x] = 0;
        remainingPellets -= 1;
        frightenedTicks = 42;
        addScore(50);
      }

      if (remainingPellets <= 0) {
        ended = true;
        overlayTitleEl.textContent = '🏆 Vittoria Arcade!';
        overlaySubEl.textContent = `Hai raccolto tutti i pallini! Punteggio: ${score}`;
        overlayBtnEl.textContent = '▶ Gioca Ancora';
        overlayEl.classList.remove('hidden');
      }
    }

    function chooseGhostDir(g) {
      const inHouse = g.y === 9 && g.x >= 8 && g.x <= 12;
      if (inHouse) {
        if (tickCount < g.releaseDelay) return { x: 0, y: 0 };
        if (g.x < 10 && canEnter(g.x + 1, g.y, true)) return DIRS.right;
        if (g.x > 10 && canEnter(g.x - 1, g.y, true)) return DIRS.left;
        if (canEnter(g.x, g.y - 1, true)) return DIRS.up;
      }

      const candidates = [DIRS.up, DIRS.left, DIRS.down, DIRS.right].filter((d) => {
        if (d.x === -g.dir.x && d.y === -g.dir.y) return false;
        const ny = g.y + d.y;
        const nx = wrapX(g.x + d.x);
        if (!canEnter(nx, ny, true)) return false;
        // Avoid walking back down into ghost house
        if (map[ny]?.[nx] === 4 && d.y > 0) return false;
        return true;
      });

      if (!candidates.length) {
        const rev = { x: -g.dir.x, y: -g.dir.y };
        return canEnter(g.x + rev.x, g.y + rev.y, true) ? rev : { x: 0, y: 0 };
      }

      if (frightenedTicks > 0) {
        return candidates[Math.floor(Math.random() * candidates.length)];
      }

      let target = g.scatter;
      const chasePhase = Math.floor(tickCount / 35) % 2 === 0;
      if (chasePhase) {
        if (g.name === 'Blinky') {
          target = { x: pac.x, y: pac.y };
        } else if (g.name === 'Pinky') {
          target = { x: pac.x + pac.dir.x * 3, y: pac.y + pac.dir.y * 3 };
        } else if (g.name === 'Inky') {
          target = { x: pac.x - pac.dir.x * 2, y: pac.y - pac.dir.y * 2 };
        } else {
          const dist = Math.hypot(g.x - pac.x, g.y - pac.y);
          target = dist > 6 ? { x: pac.x, y: pac.y } : g.scatter;
        }
      }

      let best = candidates[0];
      let bestDist = Infinity;
      for (const d of candidates) {
        const nx = wrapX(g.x + d.x);
        const ny = g.y + d.y;
        const dist = (nx - target.x) ** 2 + (ny - target.y) ** 2;
        if (dist < bestDist) {
          bestDist = dist;
          best = d;
        }
      }
      return best;
    }

    function checkCollisions() {
      for (const g of ghosts) {
        if (g.x === pac.x && g.y === pac.y) {
          if (frightenedTicks > 0) {
            addScore(200);
            g.x = g.home.x;
            g.y = g.home.y;
            g.dir = { ...DIRS.up };
          } else {
            lives -= 1;
            updateHud();
            if (lives <= 0) {
              ended = true;
              overlayTitleEl.textContent = '👻 Game Over';
              overlaySubEl.textContent = `Punteggio finale: ${score} · Record: ${highScore}`;
              overlayBtnEl.textContent = '▶ Rigioca';
              overlayEl.classList.remove('hidden');
            } else {
              resetPositions();
            }
            return true;
          }
        }
      }
      return false;
    }

    function stepGame() {
      tickCount += 1;
      stepPac();
      if (ended || checkCollisions()) return;

      // Move ghosts slightly slower when frightened
      const moveGhosts = frightenedTicks <= 0 || tickCount % 2 === 0;
      if (moveGhosts) {
        for (const g of ghosts) {
          g.dir = chooseGhostDir(g);
          g.x = wrapX(g.x + g.dir.x);
          g.y += g.dir.y;
        }
      }
      if (frightenedTicks > 0) frightenedTicks -= 1;
      checkCollisions();
    }

    function draw() {
      ctx.fillStyle = '#02040a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let y = 0; y < ROWS; y++) {
        for (let x = 0; x < COLS; x++) {
          const cell = map[y][x];
          const px = x * TILE;
          const py = y * TILE;
          if (cell === 1) {
            ctx.fillStyle = '#1e3a8a';
            ctx.fillRect(px + 1, py + 1, TILE - 2, TILE - 2);
            ctx.strokeStyle = '#3b82f6';
            ctx.lineWidth = 1;
            ctx.strokeRect(px + 2, py + 2, TILE - 4, TILE - 4);
          } else if (cell === 4) {
            ctx.fillStyle = '#f472b6';
            ctx.fillRect(px + 2, py + TILE / 2 - 2, TILE - 4, 4);
          } else if (cell === 2) {
            ctx.fillStyle = '#fde68a';
            ctx.beginPath();
            ctx.arc(px + TILE / 2, py + TILE / 2, 2.5, 0, Math.PI * 2);
            ctx.fill();
          } else if (cell === 3) {
            const pulse = 4.5 + 1.5 * Math.sin(performance.now() * 0.01);
            ctx.fillStyle = '#fef08a';
            ctx.beginPath();
            ctx.arc(px + TILE / 2, py + TILE / 2, pulse, 0, Math.PI * 2);
            ctx.fill();
          }
        }
      }

      // Draw Pac-Man
      mouthPhase += 0.22;
      const mouth = 0.22 + 0.18 * Math.abs(Math.sin(mouthPhase));
      let angle = 0;
      if (pac.dir.x < 0) angle = Math.PI;
      else if (pac.dir.y < 0) angle = -Math.PI / 2;
      else if (pac.dir.y > 0) angle = Math.PI / 2;

      const pcx = pac.x * TILE + TILE / 2;
      const pcy = pac.y * TILE + TILE / 2;
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.moveTo(pcx, pcy);
      ctx.arc(pcx, pcy, TILE * 0.42, angle + mouth, angle + Math.PI * 2 - mouth);
      ctx.closePath();
      ctx.fill();

      // Draw Ghosts
      for (const g of ghosts) {
        const gx = g.x * TILE + TILE / 2;
        const gy = g.y * TILE + TILE / 2;
        const r = TILE * 0.4;
        const isFright = frightenedTicks > 0;
        const blink = isFright && frightenedTicks < 10 && frightenedTicks % 2 === 0;
        ctx.fillStyle = isFright ? (blink ? '#e2e8f0' : '#2563eb') : g.color;
        ctx.beginPath();
        ctx.arc(gx, gy - 1, r, Math.PI, 0);
        ctx.lineTo(gx + r, gy + r - 1);
        ctx.lineTo(gx + r * 0.4, gy + r * 0.55);
        ctx.lineTo(gx, gy + r - 1);
        ctx.lineTo(gx - r * 0.4, gy + r * 0.55);
        ctx.lineTo(gx - r, gy + r - 1);
        ctx.closePath();
        ctx.fill();

        // Eyes
        ctx.fillStyle = '#fff';
        ctx.beginPath();
        ctx.arc(gx - r * 0.35, gy - 2, 2.6, 0, Math.PI * 2);
        ctx.arc(gx + r * 0.35, gy - 2, 2.6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(gx - r * 0.35 + g.dir.x, gy - 2 + g.dir.y, 1.3, 0, Math.PI * 2);
        ctx.arc(gx + r * 0.35 + g.dir.x, gy - 2 + g.dir.y, 1.3, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function togglePause() {
      if (ended) return;
      paused = !paused;
      pauseBtnEl.textContent = paused ? '▶ Riprendi' : '⏸️ Pausa';
      if (paused) {
        overlayTitleEl.textContent = '⏸️ Pausa';
        overlaySubEl.textContent = 'Premi P, Spazio o Riprendi per continuare';
        overlayBtnEl.textContent = '▶ Riprendi';
        overlayEl.classList.remove('hidden');
      } else {
        overlayEl.classList.add('hidden');
        lastTime = performance.now();
      }
    }

    function setNextDir(dirObj) {
      if (ended) return;
      pac.nextDir = { ...dirObj };
    }

    function loop(ts) {
      if (!paused && !ended && ts - lastTime >= 165) {
        lastTime = ts;
        stepGame();
      }
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); setNextDir(DIRS.up); }
      else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault(); setNextDir(DIRS.down); }
      else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); setNextDir(DIRS.left); }
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); setNextDir(DIRS.right); }
      else if (e.key === 'p' || e.key === 'P' || e.key === ' ') { e.preventDefault(); togglePause(); }
    });

    document.querySelectorAll('[data-dir]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const d = btn.getAttribute('data-dir');
        if (d && DIRS[d]) setNextDir(DIRS[d]);
      });
    });

    pauseBtnEl.addEventListener('click', togglePause);
    document.getElementById('btn-restart').addEventListener('click', resetGame);
    overlayBtnEl.addEventListener('click', () => {
      if (paused && !ended) togglePause();
      else resetGame();
    });

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
