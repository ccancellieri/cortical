<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cortical Arcade — Neon Snake</title>
  <style>
    :root {
      --bg: #070b14;
      --panel: #0f172a;
      --border: #1e293b;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --accent: #22c55e;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: radial-gradient(circle at top, #0f2420 0%, var(--bg) 68%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
    }
    .card {
      width: 100%;
      max-width: 520px;
      background: rgba(15, 23, 42, 0.94);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
      text-align: center;
    }
    h1 { margin: 0 0 4px; font-size: 1.4rem; }
    .subtitle { font-size: 0.78rem; color: var(--muted); margin-bottom: 14px; }
    .hud {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }
    .hud-box {
      background: #0b1220;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 8px;
    }
    .hud-label { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; }
    .hud-val { font-size: 1.15rem; font-weight: 800; color: #4ade80; }
    .canvas-wrap {
      position: relative;
      display: inline-block;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #243247;
      background: #050912;
    }
    canvas { display: block; max-width: 100%; height: auto; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 11, 20, 0.78);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
    }
    .overlay.hidden { display: none; }
    .controls-row {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .dpad {
      display: grid;
      grid-template-columns: repeat(3, 46px);
      gap: 6px;
      justify-content: center;
      margin-top: 12px;
    }
    button {
      font-family: inherit;
      cursor: pointer;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #1e293b;
      color: var(--text);
      padding: 8px 14px;
      font-size: 0.84rem;
      font-weight: 700;
    }
    button:hover { background: #273549; }
    .btn-primary {
      background: linear-gradient(135deg, #16a34a, #059669);
      border-color: #4ade80;
      color: #fff;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>🐍 Neon Snake</h1>
    <div class="subtitle">Frecce o WASD · Mela rossa (+10) · Mela d'oro bonus (+50) · P per Pausa</div>

    <div class="hud">
      <div class="hud-box"><div class="hud-label">Punteggio</div><div class="hud-val" id="score">0</div></div>
      <div class="hud-box"><div class="hud-label">Record</div><div class="hud-val" id="best">0</div></div>
      <div class="hud-box"><div class="hud-label">Velocità</div><div class="hud-val" id="speed">1.0x</div></div>
    </div>

    <div class="canvas-wrap">
      <canvas id="canvas" width="440" height="440"></canvas>
      <div class="overlay hidden" id="overlay">
        <div id="overlay-title" style="font-size:1.35rem; font-weight:800;">Game Over</div>
        <div id="overlay-sub" style="font-size:0.85rem; color:var(--muted);"></div>
        <button type="button" class="btn-primary" id="btn-restart">▶ Rigioca</button>
      </div>
    </div>

    <div class="controls-row">
      <button type="button" id="btn-pause">⏸️ Pausa</button>
      <button type="button" class="btn-primary" id="btn-new">🔄 Nuova Partita</button>
    </div>

    <div class="dpad" aria-label="Controlli direzionali">
      <div></div>
      <button type="button" data-dir="up">⬆️</button>
      <div></div>
      <button type="button" data-dir="left">⬅️</button>
      <button type="button" data-dir="down">⬇️</button>
      <button type="button" data-dir="right">➡️</button>
    </div>
  </main>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const bestEl = document.getElementById('best');
    const speedEl = document.getElementById('speed');
    const overlayEl = document.getElementById('overlay');
    const overlayTitleEl = document.getElementById('overlay-title');
    const overlaySubEl = document.getElementById('overlay-sub');
    const pauseBtn = document.getElementById('btn-pause');

    const COLS = 22;
    const CELL = canvas.width / COLS;
    const BEST_KEY = 'cortical_snake_best';

    let snake = [];
    let dir = { x: 1, y: 0 };
    let dirQueue = [];
    let apple = { x: 15, y: 11 };
    let golden = null;
    let particles = [];
    let score = 0;
    let highScore = Number(localStorage.getItem(BEST_KEY) || 0) || 0;
    let paused = false;
    let gameOver = false;
    let tickMs = 130;
    let lastTick = 0;

    bestEl.textContent = String(highScore);

    function randomFreeCell() {
      const occupied = new Set(snake.map((s) => `${s.x},${s.y}`));
      if (golden) occupied.add(`${golden.x},${golden.y}`);
      const free = [];
      for (let y = 0; y < COLS; y++) {
        for (let x = 0; x < COLS; x++) {
          if (!occupied.has(`${x},${y}`)) free.push({ x, y });
        }
      }
      return free[Math.floor(Math.random() * free.length)] || { x: 0, y: 0 };
    }

    function spawnBurst(gx, gy, color) {
      for (let i = 0; i < 12; i++) {
        const ang = (Math.PI * 2 * i) / 12;
        const spd = 1.2 + Math.random() * 2.2;
        particles.push({
          x: (gx + 0.5) * CELL,
          y: (gy + 0.5) * CELL,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          life: 1,
          color,
        });
      }
    }

    function resetGame() {
      snake = [{ x: 8, y: 11 }, { x: 7, y: 11 }, { x: 6, y: 11 }];
      dir = { x: 1, y: 0 };
      dirQueue = [];
      score = 0;
      tickMs = 130;
      paused = false;
      gameOver = false;
      golden = null;
      particles = [];
      apple = randomFreeCell();
      scoreEl.textContent = '0';
      speedEl.textContent = '1.0x';
      pauseBtn.textContent = '⏸️ Pausa';
      overlayEl.classList.add('hidden');
      lastTick = performance.now();
    }

    function queueDir(nx, ny) {
      if (gameOver) return;
      const last = dirQueue.length ? dirQueue[dirQueue.length - 1] : dir;
      if (last.x === -nx && last.y === -ny) return;
      if (last.x === nx && last.y === ny) return;
      if (dirQueue.length < 3) dirQueue.push({ x: nx, y: ny });
    }

    function togglePause() {
      if (gameOver) return;
      paused = !paused;
      pauseBtn.textContent = paused ? '▶ Riprendi' : '⏸️ Pausa';
      if (paused) {
        overlayTitleEl.textContent = '⏸️ Pausa';
        overlaySubEl.textContent = 'Premi P o Riprendi per continuare';
        overlayEl.classList.remove('hidden');
      } else {
        overlayEl.classList.add('hidden');
        lastTick = performance.now();
      }
    }

    function step() {
      if (dirQueue.length) dir = dirQueue.shift();
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= COLS ||
          snake.some((seg) => seg.x === head.x && seg.y === head.y)) {
        gameOver = true;
        overlayTitleEl.textContent = '💥 Game Over';
        overlaySubEl.textContent = `Punteggio finale: ${score} · Record: ${highScore}`;
        overlayEl.classList.remove('hidden');
        return;
      }

      snake.unshift(head);
      let ate = false;
      if (head.x === apple.x && head.y === apple.y) {
        score += 10;
        spawnBurst(apple.x, apple.y, '#ef4444');
        apple = randomFreeCell();
        if (!golden && Math.random() < 0.25) {
          const pos = randomFreeCell();
          golden = { x: pos.x, y: pos.y, ttl: 55 };
        }
        tickMs = Math.max(68, 130 - Math.floor(score / 25) * 4);
        ate = true;
      } else if (golden && head.x === golden.x && head.y === golden.y) {
        score += 50;
        spawnBurst(golden.x, golden.y, '#fbbf24');
        golden = null;
        ate = true;
      } else {
        snake.pop();
      }

      if (golden) {
        golden.ttl -= 1;
        if (golden.ttl <= 0) golden = null;
      }

      if (ate) {
        scoreEl.textContent = String(score);
        speedEl.textContent = `${(130 / tickMs).toFixed(1)}x`;
        if (score > highScore) {
          highScore = score;
          bestEl.textContent = String(highScore);
          try { localStorage.setItem(BEST_KEY, String(highScore)); } catch {}
        }
      }
    }

    function draw() {
      ctx.fillStyle = '#050912';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Subtle grid
      ctx.strokeStyle = 'rgba(30, 41, 59, 0.35)';
      ctx.lineWidth = 1;
      for (let i = 1; i < COLS; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL, 0);
        ctx.lineTo(i * CELL, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL);
        ctx.lineTo(canvas.width, i * CELL);
        ctx.stroke();
      }

      // Apple
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc((apple.x + 0.5) * CELL, (apple.y + 0.5) * CELL, CELL * 0.36, 0, Math.PI * 2);
      ctx.fill();

      // Golden apple
      if (golden) {
        const pulse = 0.34 + 0.08 * Math.sin(performance.now() * 0.015);
        ctx.fillStyle = '#fbbf24';
        ctx.beginPath();
        ctx.arc((golden.x + 0.5) * CELL, (golden.y + 0.5) * CELL, CELL * pulse, 0, Math.PI * 2);
        ctx.fill();
      }

      // Snake
      snake.forEach((seg, idx) => {
        const isHead = idx === 0;
        ctx.fillStyle = isHead ? '#4ade80' : (idx % 2 === 0 ? '#22c55e' : '#16a34a');
        const pad = isHead ? 1.5 : 2.5;
        ctx.fillRect(seg.x * CELL + pad, seg.y * CELL + pad, CELL - pad * 2, CELL - pad * 2);
      });

      // Particles
      particles = particles.filter((p) => p.life > 0.05);
      for (const p of particles) {
        p.x += p.vx;
        p.y += p.vy;
        p.life *= 0.9;
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
      }
      ctx.globalAlpha = 1;
    }

    function loop(ts) {
      if (!paused && !gameOver && ts - lastTick >= tickMs) {
        lastTick = ts;
        step();
      }
      draw();
      requestAnimationFrame(loop);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') { e.preventDefault(); queueDir(0, -1); }
      else if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') { e.preventDefault(); queueDir(0, 1); }
      else if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') { e.preventDefault(); queueDir(-1, 0); }
      else if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') { e.preventDefault(); queueDir(1, 0); }
      else if (e.key === 'p' || e.key === 'P') { e.preventDefault(); togglePause(); }
    });

    document.querySelectorAll('[data-dir]').forEach((btn) => {
      btn.addEventListener('click', () => {
        const d = btn.getAttribute('data-dir');
        if (d === 'up') queueDir(0, -1);
        else if (d === 'down') queueDir(0, 1);
        else if (d === 'left') queueDir(-1, 0);
        else if (d === 'right') queueDir(1, 0);
      });
    });

    document.getElementById('btn-pause').addEventListener('click', togglePause);
    document.getElementById('btn-new').addEventListener('click', resetGame);
    document.getElementById('btn-restart').addEventListener('click', resetGame);

    resetGame();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
