[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortical-agent"
version = "0.2.0"
description = "Cortical: Zero-Dependency 4-Tier Merkle/Macro-Graph Second Brain MCP, Pluggable 200k Dynamic Context Auto-Scaler, Zero-Token ROI Analytics, and Adaptive Permission Gate for pi, OpenCode & Unsloth."
readme = "README.md"
license = "Apache-2.0"
authors = [
  {name = "Carlo Cancellieri", email = "ccancellieri@hotmail.com"}
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://ccancellieri.github.io/cortical/"
Repository = "https://github.com/ccancellieri/cortical"
Issues = "https://github.com/ccancellieri/cortical/issues"

[project.scripts]
cortical = "cortical.cli:main"
cortical-wiki-mcp = "cortical.wiki.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
