[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cortical-agent"
version = "0.3.0"
description = "Cortical: Cross-Platform Zero-Server Agent Control Plane & Declarative Composer with Dynamic Privacy Vault, Lossless TOON Compression, Hardware/Variable-Quant Model Manager & Local Auto-Tuner."
readme = "README.md"
license = "Apache-2.0"
authors = [
  {name = "Carlo Cancellieri"}
]
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://ccancellieri.github.io/cortical/"
Repository = "https://github.com/ccancellieri/cortical"
Issues = "https://github.com/ccancellieri/cortical/issues"

[project.scripts]
cortical = "cortical.cli:main"
cortical-mcp = "cortical.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]
